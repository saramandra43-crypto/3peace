name: Build Driver Triple Split v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-driver-trisplit-v0.1-onefile.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare project
        shell: bash
        run: |
          cat > /tmp/project.b64 <<'B64EOF'
          
          B64EOF
          sed -i 's/^          //' /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/work

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          cd /tmp/work/DriverTripleSplit_v0.1
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverTripleSplit-v0.1-debug-apk
          path: /tmp/work/DriverTripleSplit_v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
