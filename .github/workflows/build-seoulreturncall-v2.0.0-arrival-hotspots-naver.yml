        uses: actions/upload-artifact@v4
        with:
          name: SeoulReturnCall-v2.0.0-ArrivalHotspotsNaver-apk
          path: project/SeoulReturnCall_v2.0.0_ArrivalHotspotsNaver/app/build/outputs/apk/debug/app-debug.apk
