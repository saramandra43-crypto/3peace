      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/SeoulReturnCall_v1.7.0_CardTimePresets
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeoulReturnCall-v1.7.0-CardTimePresets-apk
          path: project/SeoulReturnCall_v1.7.0_CardTimePresets/app/build/outputs/apk/debug/app-debug.apk
