name: Build SeoulReturnCall Warm UI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "sdkmanager를 찾지 못했습니다."
            find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR="$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle 파일을 찾지 못했습니다."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "APK를 찾지 못했습니다."
            exit 1
          fi

          cp "$APK_PATH" SeoulReturnCall-v2.6.0-warm-ui-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeoulReturnCall-v2.6.0-warm-ui-debug
          path: SeoulReturnCall-v2.6.0-warm-ui-debug.apk
          if-no-files-found: error
