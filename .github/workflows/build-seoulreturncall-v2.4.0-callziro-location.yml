      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/SeoulReturnCall_v2.4.0_CallziroLocation
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeoulReturnCall-v2.4.0-CallziroLocation-apk
          path: project/SeoulReturnCall_v2.4.0_CallziroLocation/app/build/outputs/apk/debug/app-debug.apk
